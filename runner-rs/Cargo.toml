[package]
name = "runner"
version = "0.1.0"
edition = "2021"
description = "Declarative task scheduler for macOS using launchd"
authors = ["nocoo"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# File locking
fs2 = "0.4"

# UUID
uuid = { version = "1", features = ["v4"] }

# Process management
nix = { version = "0.29", features = ["process", "signal"] }

# Error handling
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
pretty_assertions = "1"

[[bin]]
name = "runner"
path = "src/main.rs"

[lib]
name = "runner_lib"
path = "src/lib.rs"
