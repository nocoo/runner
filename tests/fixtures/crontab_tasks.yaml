# =============================================================================
# Test Fixtures - Crontab-style Tasks Configuration
# =============================================================================

# Schedule rules (crontab-style)
# Supported syntax:
#   *     - any value
#   N     - exact value
#   N,M   - list of values
#   N-M   - range of values
#   */N   - step/interval
#
# Fields: hour, minute, weekday
# weekday: 0=Sunday, 1=Monday, ..., 6=Saturday, "*"=every day
#
# IMPORTANT: First match wins! More specific rules should come before general ones.

schedules:
  # --- Basic exact match (most specific) ---
  - task: morning_briefing
    hour: 9
    minute: 5
    weekday: "*"

  - task: end_of_day_task
    hour: 23
    minute: 59
    weekday: "*"

  - task: weekly_synthesis
    hour: 20
    minute: 0
    weekday: 0          # Sunday only

  # --- List syntax (specific times) ---
  - task: list_task
    hour: 8
    minute: "0,15,30,45"
    weekday: "*"

  - task: hour_list_task
    hour: "18,19,21"     # Changed to avoid conflict with range_task
    minute: 0
    weekday: "*"

  - task: weekday_list_task
    hour: 10
    minute: 30
    weekday: "1,3,5"    # Mon, Wed, Fri

  # --- Range syntax ---
  - task: range_task
    hour: "9-17"
    minute: 0
    weekday: "*"

  - task: minute_range_task
    hour: 7
    minute: "0-10"
    weekday: "*"

  # --- Step syntax ---
  - task: step_task
    hour: 6
    minute: "*/10"
    weekday: "*"

  - task: step15_task
    hour: 5
    minute: "*/15"
    weekday: "*"

  - task: hour_step_task
    hour: "*/2"
    minute: 30
    weekday: "*"

  # --- Complex combinations ---
  - task: work_hours_task
    hour: "9,12,15,18"
    minute: 1           # Use minute: 1 to avoid conflict with range_task (minute: 0)
    weekday: "1-5"      # Mon-Fri

  # --- Wildcard tests (less specific, put near end) ---
  - task: continuous_task
    hour: 12
    minute: "*"
    weekday: "*"

  - task: heartbeat_any_hour
    hour: "*"
    minute: 0
    weekday: "*"

  # --- Most general (always matches, MUST be last) ---
  - task: always_task
    hour: "*"
    minute: "*"
    weekday: "*"

# Task metadata - all use agent type with inline prompts
tasks:
  morning_briefing:
    type: agent
    description: "Daily morning briefing"
    timeout: 300
    prompt: "Generate morning briefing."

  heartbeat_any_hour:
    type: simple
    description: "Heartbeat at minute 0 of every hour"
    timeout: 60
    command: "echo heartbeat"

  continuous_task:
    type: simple
    description: "Runs every minute at hour 12"
    timeout: 60
    command: "echo continuous"

  always_task:
    type: simple
    description: "Runs every minute (testing only)"
    timeout: 60
    command: "echo always"

  list_task:
    type: simple
    description: "Runs at specific minutes"
    timeout: 60
    command: "echo list task"

  hour_list_task:
    type: simple
    description: "Runs at specific hours"
    timeout: 60
    command: "echo hour list"

  weekday_list_task:
    type: simple
    description: "Runs on specific weekdays"
    timeout: 60
    command: "echo weekday list"

  range_task:
    type: simple
    description: "Runs during work hours"
    timeout: 60
    command: "echo range"

  minute_range_task:
    type: simple
    description: "Runs in first 10 minutes"
    timeout: 60
    command: "echo minute range"

  step_task:
    type: simple
    description: "Runs every 10 minutes"
    timeout: 60
    command: "echo step"

  step15_task:
    type: simple
    description: "Runs every 15 minutes"
    timeout: 60
    command: "echo step 15"

  hour_step_task:
    type: simple
    description: "Runs every 2 hours"
    timeout: 60
    command: "echo hour step"

  end_of_day_task:
    type: simple
    description: "Runs at 23:59"
    timeout: 60
    command: "echo end of day"

  weekly_synthesis:
    type: agent
    description: "Weekly summary"
    timeout: 600
    prompt: "Generate weekly synthesis."

  work_hours_task:
    type: simple
    description: "Runs during work hours on weekdays"
    timeout: 60
    command: "echo work hours"
