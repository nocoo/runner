name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  swift-tests:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runner: "macos-latest"
      runtime: "none"
      command: "cd runner-swift && swift test --no-parallel"

  dashboard-quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      working-directory: "dashboard"
      test-command: "bun run test"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      security: false
      disabled-check-reasons: '{"security": "security scans run at repository root in separate security job"}'
    secrets: inherit

  security:
    uses: nocoo/base-ci/.github/workflows/security.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      lockfiles: "bun.lock,dashboard/bun.lock"
      osv-config: "osv-scanner.toml"
      gitleaks-config: ".gitleaks.toml"
