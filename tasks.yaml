# =============================================================================
# Runner Tasks Configuration
# =============================================================================
#
# Task Types:
#   - simple: Execute a CLI command directly (fast, no agent overhead)
#   - agent: Run opencode agent with a prompt (for complex AI tasks)
#
# =============================================================================

# Schedule rules
# hour/minute: number, "*" (any), "*/N" (step), "N-M" (range), "N,M,O" (list)
# weekday: 0=Sunday, 1=Monday, ..., 6=Saturday, "*"=every day
schedules:
  # Clock - hourly and half-hourly chime
  - task: clock
    hour: "*"
    minute: 0
    weekday: "*"
  - task: clock
    hour: "*"
    minute: 30
    weekday: "*"

  # Heartbeat - every 10 minutes (except :00 and :30 which are clock)
  - task: heartbeat
    hour: "*"
    minute: 10
    weekday: "*"
  - task: heartbeat
    hour: "*"
    minute: 20
    weekday: "*"
  - task: heartbeat
    hour: "*"
    minute: 40
    weekday: "*"
  - task: heartbeat
    hour: "*"
    minute: 50
    weekday: "*"

# Task definitions
tasks:
  # ─────────────────────────────────────────────────────────────────────────────
  # Heartbeat - Simple CLI task (no agent, instant execution)
  # ─────────────────────────────────────────────────────────────────────────────
  heartbeat:
    type: simple
    description: "Heartbeat - play a soft pop sound every 10 minutes"
    timeout: 10
    command: "afplay /System/Library/Sounds/Pop.aiff"

  # ─────────────────────────────────────────────────────────────────────────────
  # Clock - Agent task (uses opencode for intelligent chime)
  # ─────────────────────────────────────────────────────────────────────────────
  clock:
    type: agent
    description: "Clock chime - announce time with text-to-speech"
    timeout: 60
    workdir: "."
    prompt: |
      # 整点报时

      用 `say` 命令播报当前时间，格式：「现在是 X 点 Y 分」

      示例：
      - 整点：say "现在是九点整"
      - 半点：say "现在是九点三十分"

      **只执行 say 命令，不做其他任何操作。**
