# =============================================================================
# Runner Tasks Configuration
# =============================================================================

# Schedule rules
# weekday: 0=Sunday, 1=Monday, ..., 6=Saturday, "*"=every day
schedules:
  # Clock - hourly and half-hourly chime
  - task: clock
    hour: "*"
    minute: 0
    weekday: "*"
  - task: clock
    hour: "*"
    minute: 30
    weekday: "*"

  # Heartbeat - every 10 minutes (except :00 and :30 which are clock)
  - task: heartbeat
    hour: "*"
    minute: 10
    weekday: "*"
  - task: heartbeat
    hour: "*"
    minute: 20
    weekday: "*"
  - task: heartbeat
    hour: "*"
    minute: 40
    weekday: "*"
  - task: heartbeat
    hour: "*"
    minute: 50
    weekday: "*"

# Task metadata
tasks:
  clock:
    description: "Clock chime - play a distinct sound on the hour and half-hour"
    timeout: 30

  heartbeat:
    description: "Heartbeat - play a soft sound every 10 minutes"
    timeout: 30
