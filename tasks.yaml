# =============================================================================
# Runner Tasks Configuration
# =============================================================================

# Schedule rules
# weekday: 0=Sunday, 1=Monday, ..., 6=Saturday, "*"=every day
schedules:
  # Heartbeat - every 10 minutes, 24x7
  # :00
  - task: heartbeat
    hour: "*"
    minute: 0
    weekday: "*"
  # :10
  - task: heartbeat
    hour: "*"
    minute: 10
    weekday: "*"
  # :20
  - task: heartbeat
    hour: "*"
    minute: 20
    weekday: "*"
  # :30
  - task: heartbeat
    hour: "*"
    minute: 30
    weekday: "*"
  # :40
  - task: heartbeat
    hour: "*"
    minute: 40
    weekday: "*"
  # :50
  - task: heartbeat
    hour: "*"
    minute: 50
    weekday: "*"

  - task: morning_briefing
    hour: 9
    minute: 5
    weekday: "*"

  - task: xray_hourly
    hour: 13
    minute: 20
    weekday: "*"

  - task: evening_review
    hour: 21
    minute: 0
    weekday: "*"

  - task: weekly_synthesis
    hour: 20
    minute: 0
    weekday: 0          # Sunday

  - task: memory_cleanup
    hour: 3
    minute: 0
    weekday: 1          # Monday

# Task metadata
tasks:
  heartbeat:
    description: "Heartbeat - play a short sound every 10 minutes"
    timeout: 30

  morning_briefing:
    description: "Daily morning briefing - summarize today's priorities and important info"
    timeout: 300

  xray_hourly:
    description: "X-Ray pipeline - fetch, classify, and report X content"
    timeout: 600
    workdir: /Users/nocoo/workspace/personal/xray

  evening_review:
    description: "Daily evening review - reflect on day's activities and plan tomorrow"
    timeout: 300

  weekly_synthesis:
    description: "Weekly summary - synthesize week's work and plan next week"
    timeout: 600

  memory_cleanup:
    description: "Memory cleanup - archive old memories and clean up outdated data"
    timeout: 300
